# =============================================================================
# FusionBench Method Configuration: DARE + TIES Merging (Causal LM)
# =============================================================================
# DARE random dropout followed by TIES-merging. For MergeBench Llama-3.2-3B,
# `merge_backbone=true` preserves embed_tokens / lm_head from the pretrained
# model.
# =============================================================================
_target_: fusion_bench.method.dare.DareTiesMergingForCausalLM
# === DARE parameters ===
sparsity_ratio: 0.5
only_on_linear_weights: false
rescale: true
# === TIES parameters ===
scaling_factor: 0.5
threshold: 20
remove_keys: []
merge_func: sum
# Merge only model.layers (recommended for MergeBench)
merge_backbone: true
# Path to save the merged model
model_save_path: ${path.log_dir}/checkpoint

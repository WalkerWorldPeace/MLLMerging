_target_: fusion_bench.method.yongxianwei_merging.algorithm.YongxianweiMergingAlgorithm
_recursive_: false
method_name: aswudi
scaling_coefficient: 1.0
exclude_param_names_regex: []
merge_device: null
load_on_cpu: false
strict: false
method_kwargs:
  # ASWUDI + Path A "WUDI risk" rank rule.  Per layer, K* is chosen
  # as the argmin of WUDI's full quadratic risk
  #
  #     R(K) = ‖θ_K C - D‖_F²  +  ρ · ‖θ_K‖_F² ,
  #
  # i.e. the K that simultaneously minimises proxy fit error and
  # noise-direction amplification.  ρ = 1 (default ``wudi_risk``) is
  # zero-hyperparameter and unit-consistent (both terms in squared
  # Frobenius); override to ``wudi_risk_<rho>`` (e.g. ``wudi_risk_0.5``)
  # for a single principled knob.
  auto_rank_method: wudi_risk

  filter_type: none
  exp_time: 1.0e6

  rank_scale: 1.0
  min_rank: 1
  max_rank_ratio: 1.0

  init_mode: sum
  min_eigenvalue: 1.0e-8

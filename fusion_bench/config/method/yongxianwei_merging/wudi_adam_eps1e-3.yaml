_target_: fusion_bench.method.yongxianwei_merging.algorithm.YongxianweiMergingAlgorithm
_recursive_: false
method_name: wudi
scaling_coefficient: 1.0
exclude_param_names_regex: []
merge_device: null
load_on_cpu: false
strict: false
method_kwargs:
  # R4 -- WUDI loss with Adam but eps=1e-3. Flattens the 2nd-moment
  # denominator in small-lambda directions without changing the optimizer.
  # Tests whether norm explosion is caused by Adam's eps-too-small.
  iter_num: 300
  learning_rate: 1.0e-5
  optimizer: adam
  eps: 1.0e-3
  log_norm_history: true

# CLIP-ViT-B/32 TA8 modelpool with SWUDI-merged checkpoint as `_pretrained_`,
# for the AdaMerging × SWUDI experiment (§5.X of iwudi_paper.md).
#
# AdaMerging will compute task vectors v_i = W_finetuned_i - W_swudi
# (residuals after SWUDI), then learn layer-wise weights λ_{i,l} and form
#   W_merged = W_swudi + Σ_i λ_{i,l} v_i
# With init_values=0 the optimization starts at SWUDI's solution.

defaults:
  - /dataset/image_classification/train@train_datasets:
      - sun397
      - stanford-cars
      - resisc45
      - eurosat
      - svhn
      - gtsrb
      - mnist
      - dtd
  - /dataset/image_classification/test@test_datasets:
      - sun397
      - stanford-cars
      - resisc45
      - eurosat
      - svhn
      - gtsrb
      - mnist
      - dtd
  - _self_
_target_: fusion_bench.modelpool.CLIPVisionModelPool
_recursive_: False
processor: openai/clip-vit-base-patch32
models:
  _pretrained_: outputs/yongxianwei_merging/merged_clip/swudi_b32_full
  sun397: tanganke/clip-vit-base-patch32_sun397
  stanford-cars: tanganke/clip-vit-base-patch32_stanford-cars
  resisc45: tanganke/clip-vit-base-patch32_resisc45
  eurosat: tanganke/clip-vit-base-patch32_eurosat
  svhn: tanganke/clip-vit-base-patch32_svhn
  gtsrb: tanganke/clip-vit-base-patch32_gtsrb
  mnist: tanganke/clip-vit-base-patch32_mnist
  dtd: tanganke/clip-vit-base-patch32_dtd
platform: hf
